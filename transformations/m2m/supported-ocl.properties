# Perfil OCL soportado por PimToSpringPsm.atl. No es una transformacion.
SistemaVuelos.AeropuertoIdentidadUnica=self.aeropuertos->isUnique(x | x.codigo)
SistemaVuelos.AerolineaIdentidadUnica=self.aerolineas->isUnique(x | x.codigo)
SistemaVuelos.AvionIdentidadUnica=self.aviones->isUnique(x | x.matricula)
SistemaVuelos.VueloIdentidadUnica=self.vuelos->isUnique(x | x.codigo)
SistemaVuelos.PasajeroIdentidadUnica=self.pasajeros->isUnique(x | x.documento)
SistemaVuelos.ReservaIdentidadUnica=self.reservas->isUnique(x | x.localizador)
SistemaVuelos.BoletoIdentidadUnica=self.boletos->isUnique(x | x.numero)
SistemaVuelos.RutasUnicas=self.rutas->forAll(a, b | a <> b implies (a.origen <> b.origen or a.destino <> b.destino))
SistemaVuelos.ReferenciasDentroDelSistema=self.aviones->forAll(a | self.aerolineas->includes(a.aerolinea)) and self.rutas->forAll(r | self.aeropuertos->includes(r.origen) and self.aeropuertos->includes(r.destino)) and self.vuelos->forAll(v | self.rutas->includes(v.ruta) and self.aviones->includes(v.avion)) and self.reservas->forAll(r | self.pasajeros->includes(r.pasajero) and self.vuelos->includes(r.vuelo)) and self.boletos->forAll(b | self.reservas->includes(b.reserva))
Aeropuerto.TextosNoVacios=not self.codigo.oclIsUndefined() and self.codigo <> '' and not self.nombre.oclIsUndefined() and self.nombre <> '' and not self.ciudad.oclIsUndefined() and self.ciudad <> ''
Aerolinea.TextosNoVacios=not self.codigo.oclIsUndefined() and self.codigo <> '' and not self.nombre.oclIsUndefined() and self.nombre <> ''
Avion.TextosNoVacios=not self.matricula.oclIsUndefined() and self.matricula <> ''
Avion.CapacidadPositiva=self.capacidad > 0
Ruta.OrigenDistintoDestino=self.origen <> self.destino
Vuelo.TextosNoVacios=not self.codigo.oclIsUndefined() and self.codigo <> ''
Vuelo.CapacidadRespetada=self.reservas->select(r | r.estado = EstadoReserva::CONFIRMADA)->size() <= self.avion.capacidad
Vuelo.AsientosConfirmadosUnicos=self.reservas->select(r | r.estado = EstadoReserva::CONFIRMADA)->isUnique(r | r.numeroAsiento)
Vuelo.PasajerosConfirmadosUnicos=self.reservas->select(r | r.estado = EstadoReserva::CONFIRMADA)->isUnique(r | r.pasajero)
Pasajero.TextosNoVacios=not self.documento.oclIsUndefined() and self.documento <> '' and not self.nombreCompleto.oclIsUndefined() and self.nombreCompleto <> '' and not self.contacto.oclIsUndefined() and self.contacto <> ''
Reserva.TextosNoVacios=not self.localizador.oclIsUndefined() and self.localizador <> ''
Reserva.AsientoEnRango=self.numeroAsiento >= 1 and self.numeroAsiento <= self.vuelo.avion.capacidad
Boleto.TextosNoVacios=not self.numero.oclIsUndefined() and self.numero <> ''
Boleto.ReservaConfirmada=self.reserva.estado = EstadoReserva::CONFIRMADA
