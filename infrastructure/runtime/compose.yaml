name: mda-vuelos
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vuelos
      POSTGRES_USER: vuelos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD antes de iniciar PostgreSQL}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../generated/backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuelos -d vuelos && psql -U vuelos -d vuelos -c 'SELECT 1 FROM public.boletos LIMIT 0' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
